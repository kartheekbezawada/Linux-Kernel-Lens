[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-opt"
version = "0.1.0"
description = "Linux system discovery, performance analysis, and tuning toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
linux-opt = "linux_opt.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
