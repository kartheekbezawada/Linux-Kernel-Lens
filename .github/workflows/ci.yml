name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    # Ubuntu is the only runner that gives real /proc /sys content, which
    # matters for anything that goes beyond this project's unit tests
    # (integration/functional tests will need it; unit tests alone don't).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -v

      - name: Sanity-check CLI entrypoint
        run: |
          linux-opt scan --format json > /dev/null
          linux-opt benchmark
